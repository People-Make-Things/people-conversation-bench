[project]
name = "people-bench"
version = "0.1.0"
description = "Realtime voice model benchmark and deployment"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.47",
    "modal>=0.73.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26,<2.2",
    "sphn>=0.1.4,<0.2",
    "websockets>=12.0",
    "sounddevice>=0.5.0",
    "openai-whisper>=20231117",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    # 6.x needs transformers>=5; qwen-tts (extra tts) pins transformers==4.57.3.
    "sentence-transformers>=5,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
tts = [
    "qwen-tts",
]

[project.scripts]
bench = "scripts.interact:main"
prepare-eval = "data_processing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench", "data_processing", "scripts", "utils"]
